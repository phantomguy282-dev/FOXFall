# GitHub Release automation for FOXFall
name: Build and Release FOXFall

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download FFmpeg (portable, official gyan.dev build)
        run: |
          New-Item -ItemType Directory -Force bin\ffmpeg | Out-Null
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg-x" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-x" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $probe = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-x" -Recurse -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $exe.FullName bin\ffmpeg\
          Copy-Item $probe.FullName bin\ffmpeg\
          bin\ffmpeg\ffmpeg.exe -version | Select-Object -First 1

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests -q --ignore=tests/test_tiktok_live.py --ignore=tests/test_progress_live.py

      - name: Build FOXFall.exe
        run: python -m PyInstaller foxfall.spec --noconfirm

      - name: Smoke test the build
        run: |
          if (-not (Test-Path "dist\FOXFall\FOXFall.exe")) { throw "FOXFall.exe missing" }
          if (-not (Test-Path "dist\FOXFall\_internal\bin\ffmpeg\ffmpeg.exe")) { throw "bundled ffmpeg missing" }

      - name: Package portable zip
        run: |
          Compress-Archive -Path dist\FOXFall -DestinationPath FOXFall-windows-portable.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FOXFall-windows-portable.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}